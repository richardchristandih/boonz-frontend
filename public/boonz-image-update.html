<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Update Boonz menu images</title>
  <style>
    body { max-width: 760px; margin: 30px auto; padding: 0 16px; font: 16px/1.5 system-ui, sans-serif; color: #25312c; background: #f4f7f2; }
    h1 { margin-bottom: 0; }
    ul { display: grid; gap: 8px; padding: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px; border: 1px solid #d1dfd2; background: white; }
    img { width: 56px; height: 56px; object-fit: contain; }
    small { display: block; color: #53645a; }
    button, .action { display: inline-block; background: #fb7e00; color: #25312c; padding: 10px 14px; border: 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    button:disabled { opacity: .5; cursor: default; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Update Boonz menu images</h1>
  <p>Apply the verified image links to these five products.</p>
  <ul id="products" aria-label="Product images"></ul>
  <p id="status" role="status"></p>
  <button type="button" id="apply" hidden>Apply image updates</button>
  <a class="action" id="login" href="/login" hidden>Sign in to Boonz</a>
  <script>
    const changes = [
      { name: "Crispy Chick Melt", sku: "CCM-001", id: "6a068aa0f1c08fdd9356bd0b", next: "oKXZzYX", previous: "https://iili.io/CRhXRJR.png" },
      { name: "Mozzarella Cheese", sku: "MCC-001", id: "6a068ad0f1c08fdd9356bd11", next: "oKXZx2t", previous: "https://iili.io/CRjDiP9.png" },
      { name: "Mayo Garlic Sauce", sku: "SC-002", id: "6915bb4b0450ef23fd6eba97", next: "oKXZCEN", previous: "" },
      { name: "Saus Sambal", sku: "SC-003", id: "6915bb750450ef23fd6ebaa5", next: "oKXZBBp", previous: "" },
      { name: "Saus Tomat", sku: "SC-004", id: "6915bb870450ef23fd6ebaab", next: "oKXZn4I", previous: "" },
    ];
    const products = document.querySelector("#products");
    const status = document.querySelector("#status");
    const apply = document.querySelector("#apply");
    const login = document.querySelector("#login");
    const rows = new Map();
    const destination = (id) => `https://iili.io/${id}.png`;

    for (const change of changes) {
      const row = document.createElement("li");
      const image = document.createElement("img");
      image.src = destination(change.next);
      image.alt = "";
      const copy = document.createElement("div");
      const name = document.createElement("strong");
      name.textContent = change.name;
      const result = document.createElement("small");
      result.textContent = change.sku;
      copy.append(name, result);
      row.append(image, copy);
      products.append(row);
      rows.set(change.id, result);
    }

    function revealLogin(message) {
      status.textContent = message;
      apply.hidden = true;
      login.hidden = false;
    }

    function session() {
      let user = null;
      try { user = JSON.parse(localStorage.getItem("user")); } catch {}
      return { user, token: localStorage.getItem("token") };
    }

    function reportSession() {
      const { user, token } = session();
      if (!token || !user) {
        revealLogin("Sign in with your Boonz admin account to apply these images.");
      } else if (user.role !== "admin" && user.isAdmin !== true) {
        revealLogin("These product edits require a Boonz admin account.");
      } else {
        apply.hidden = false;
        login.hidden = true;
        status.textContent = "Ready to update the five product images.";
      }
    }

    async function request(path, token, options = {}) {
      const response = await fetch(`/api/products${path}`, {
        ...options,
        cache: "no-store",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      });
      if (!response.ok) {
        const error = new Error(`Server response ${response.status}`);
        error.status = response.status;
        throw error;
      }
      return response.json();
    }

    apply.addEventListener("click", async () => {
      apply.disabled = true;
      status.textContent = "Checking product records…";
      let failures = 0;
      try {
        const { token } = session();
        if (!token) {
          revealLogin("Sign in again to complete the update.");
          return;
        }
        for (const change of changes) {
          const row = rows.get(change.id);
          try {
            const product = await request(`/${change.id}`, token);
            if (product.sku !== change.sku) throw new Error("Product ID and SKU do not agree.");
            const imageUrl = destination(change.next);
            const currentUrl = product.imageUrl || product.image || "";
            if (currentUrl === imageUrl) {
              row.textContent = "Already up to date";
              continue;
            }
            if (currentUrl !== change.previous) throw new Error("Image changed since review. Kept the current image.");
            row.textContent = "Saving…";
            await request(`/${change.id}`, token, { method: "PUT", body: JSON.stringify({ imageUrl }) });
            const checked = await request(`/${change.id}`, token);
            if (checked.imageUrl !== imageUrl) throw new Error("Couldn’t verify the saved image.");
            row.textContent = "Saved and verified";
          } catch (error) {
            if (error.status === 401 || error.status === 403) {
              row.textContent = "Sign in required";
              revealLogin("Sign in as a Boonz admin, then return to this page to finish. Saved images will be skipped.");
              return;
            }
            row.textContent = error.message;
            failures += 1;
          }
        }
        status.textContent = failures ? `${failures} image updates need attention. Review the messages above.` : "All five product images are current and verified.";
        if (!failures) apply.hidden = true;
      } finally {
        apply.disabled = false;
      }
    });

    reportSession();
  </script>
</body>
</html>
